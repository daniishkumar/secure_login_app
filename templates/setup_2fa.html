{% extends "base.html" %}
{% block content %}
<h2>Enable Two-Factor Authentication</h2>
<p>Scan this QR code with Google Authenticator, Authy, or a similar app:</p>
<img class="qr" src="data:image/png;base64,{{ qr_base64 }}" width="200" height="200">
<p style="font-size:13px; color:#666;">Can't scan? Enter this key manually: <code>{{ secret }}</code></p>
<form method="POST">
    <input type="text" name="code" placeholder="Enter 6-digit code to confirm" maxlength="6" required autofocus>
    <button type="submit">Confirm & Enable</button>
</form>
{% endblock %}
